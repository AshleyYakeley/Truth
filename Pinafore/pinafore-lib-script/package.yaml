_common: !include "../../common.yaml"
name: pinafore-lib-script
version: *pinafore_version
<<: *author

<<: *language

data-dir: data
data-files: "**/*.pinafore"

library:
    source-dirs: lib
    dependencies:
      - base >= 4.16
      - shapes
      - pinafore-language
    exposed-modules:
      - Pinafore.Library.Script

tests:
    test:
        source-dirs: test
        dependencies:
          - base >= 4.16
          - directory
          - shapes
          - pinafore-language
          - pinafore-lib-media
          - pinafore-lib-gnome
          - pinafore-lib-script
        main: Main.hs
        ghc-options: -threaded
